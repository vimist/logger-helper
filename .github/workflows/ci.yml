name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - run: pip3 install codeclimate-test-reporter

      - run: invoke unit-test

      - run: invoke test-install

      - run: invoke lint-module

      - run: invoke lint-tests

      - run: invoke build-docs

      - run: codeclimate-test-reporter

      - if: startsWith(github.ref, 'refs/tags/')
